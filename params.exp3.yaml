run_name: exp3_100epochs
data:
  countries: [Czech, India]
train:
  model: yolov8s.pt
  epochs: 100
  imgsz: 640
  batch: 16
  fraction: 1.0
  device: 0
  workers: 4
  seed: 42
  train:
    extra: {patience: 30, cos_lr: true}
  oversample:
    transverse_crack: 3
evaluate:
  splits: [valid, test]
  device: 0
  batch: 16
  workers: 4